packages:
  - "."

# Nest 12.0.0-alpha.* still declares stale peer ranges on sibling packages.
peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"

# @nestjs/core's postinstall is only a donation banner. tsdown receives
# platform binaries as optional dependencies, so esbuild's script is not needed.
allowBuilds:
  "@nestjs/core": false
  esbuild: false

# A failed npm OIDC attestation must fail rather than silently publishing
# without provenance.
provenance: true
